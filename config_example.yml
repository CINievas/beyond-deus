hazard_prefix: HAZ  # Prefix to be used in the naming of output files
input_paths:
  intensity: path_to_intensity_input_files  # If a directory with XML files, all files will be processed; otherwise path to one HDF5 file
  fragility: path_to_fragility_file  # One fragility json file
  exposure_csv: path_to_exposure_csv_files  # One directory with all exposure csv files
  exposure_gpkg: path_to_exposure_gpkg_file  # One exposure gpkg file with exposure polygons and their centroids
  conversion_taxonomy: path_to_directory_with_taxonomy_conversion_files # All files in this directory will be used
  conversion_damage_states: path_to_directory_with_damage_states_conversion_files  # All files in this directory will be used
  consequence: path_to_consequence_model_file  # One json file with economic consequence model
  usability: path_to_usability_file  # One csv file indicating if buildings in each damage state are usable/unusable
output_path: path_to_output_folder  # Folder to which the outputs will be written, must be empty
output_path_profiling: path_to_profiling_output_fikder  # Folder to which the outputs of profiling.py will be written
running_mode: processing  # Supported: processing (only calculating damage/loss), post-processing (only stats of previous calculations), full (both)
parallelisation_mode: parallelisation_mode  # Supported: by_input_exposure, by_intensity_realisation
cpus: 1  # Number of processors to use in the parallelisation
parameters:
  building_schema_exposure: source_schema_name  #  Name of the building classification schema of the input exposure (one string)
  building_schema_fragility: target_schema_name  # Name of the building classification schema of the output, i.e. of the fragility model (one string)
  intensity_file_type: intensity_file_type  # Type of intensity input files. Supported values: xml, hdf5, netcdf_tsu
  intensity_threshold: theshold_value # Threshold of hazard intensity. If intensity value < threshold, no further damage assumed
output_types:  # Write True/False next to each option, to export or not export the corresponding output type
  compress_exposure_csvs: True  # If True, the updated exposure CSVs will be compressed into zstd format
  mapped_exposure:
    csv: True
  full_updated_exposure:
    csv: True
    csv_usable: True
    csv_unusable: True
    hdf5_per_realisation: False
  by_final_damage:
    csv_per_realisation: True
  by_initial_and_final_damage:
    csv_per_realisation: True
  by_building_id:
    loss_csv_per_realisation: True
    loss_gpkg_per_realisation: True
    only_transitioned_loss_csv_per_realisation: False
    only_transitioned_loss_gpkg_per_realisation: False
    damage_csv_per_realisation: True
    damage_gpkg_per_realisation: True
    only_transitioned_damage_csv_per_realisation: False
    only_transitioned_damage_gpkg_per_realisation: False
    damage_with_people_csv_per_realisation: True
    damage_with_people_gpkg_per_realisation: True
post_processing:
  target_quantiles: 0.05, 0.16, 0.25, 0.5, 0.75, 0.84, 0.95  # quantiles for stats
  logic_tree_meta:  # the logic tree must include previously-run hazards
    1:  # order in which the hazard was applied 1, 2, 3...
      hazard_prefix: PREHAZ  # hazard_prefix as used in the software run
      logic_tree_path: path_to_PREHAZ_logic_tree_file  # file with names and weights of branches
      realisations: 100  # realisations per logic tree branch
    2:
      hazard_prefix: HAZ
      logic_tree_path: path_to_HAZ_logic_tree_file
      realisations: 1
  initial_damage_range: 0, 1, 2, 3, 4  # initial damage states (of the last hazard run)
  final_damage_range: 0, 1, 2, 3, 4  # final damage states (of the last hazard run)
  types:
    by_initial_and_final_damage_all: True
    by_initial_and_final_damage_per_branch: True
    loss_by_building_id_per_branch: True
    damage_by_building_id_per_branch: True
    damage_with_people_by_building_id_per_branch: True
